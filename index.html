<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            background-image: url(imges/thanh_nguyen_slq-artwork-7141119.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;

        }

        .rental-container {
            width: 400px;
        }

        .title {
            color: #32166f;
        }

        .form-label,
        .form-check-label,
        .benefits {
            color: #32166f;
        }
        .btn-s {
            background-color: rgb(224, 60, 166);
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="container rental-container bg-white rounded-4 shadow p-4">

        <h5 class="title fw-bold mb-4">
            Search for a rental car
        </h5>


        <label class="form-label">
            Pick up location
        </label>

        <input type="text" class="form-control form-control-sm mb-2" placeholder="City, airport, region, district...">


        <div class="form-check mb-3">

            <input class="form-check-input" type="checkbox" id="deliver">

            <label class="form-check-label" for="deliver">
                Deliver the car somewhere else
            </label>

        </div>


        <div class="row g-2">

            <div class="col-6">

                <label class="form-label">
                    Date of pickup
                </label>

                <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-calendar3"></i>
                    </span>

                    <input type="date" class="form-control form-control-sm">
                </div>

            </div>


            <div class="col-6">

                <label class="form-label">
                    Date of delivery
                </label>

                <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-calendar3"></i>
                    </span>

                    <input type="date" class="form-control form-control-sm">
                </div>

            </div>

        </div>


        <div class="row g-2 mt-1 mb-3">

            <div class="col-3">
                <select class="form-select form-select-sm">
                    <option>10</option>

                </select>
            </div>

            <div class="col-3">
                <select class="form-select form-select-sm">
                    <option>00</option>
                   
                </select>
            </div>

            <div class="col-3">
                <select class="form-select form-select-sm">
                    <option>10</option>
                   
                </select>
            </div>

            <div class="col-3">
                <select class="form-select form-select-sm">
                    <option>00</option>
                   
                </select>
            </div>

        </div>


        <div class="form-check mb-2">

            <input class="form-check-input" type="checkbox" id="age" checked>

            <label class="form-check-label" for="age">
                The driver's age between 30 and 65?
            </label>
            <i class="bi bi-info-circle"></i>

        </div>


        <div class="benefits mb-3">

            <div>✓ No credit card fees</div>
            <div>✓ No change fees</div>
            <div>✓ Price match guarantee</div>

        </div>


        <button class="btn btn-s rounded-pill w-100 fw-bold search-btn">
            Search
        </button>

    </div>

</body>

</html>
